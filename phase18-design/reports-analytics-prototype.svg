  <text x="32" y="408" font-size="13" fill="#4a4a4a">📜 Audit Trail</text>
  <text x="32" y="448" font-size="13" fill="#4a4a4a">🛡️ Security Centre</text>
  <rect x="16" y="475" width="208" height="36" rx="6" fill="#1a6b4a"/>
  <text x="32" y="498" font-size="13" font-weight="600" fill="#ffffff">📈 Reports &amp; Analytics</text>
  <text x="32" y="540" font-size="13" fill="#4a4a4a">⚙️ Platform Settings</text>

  <!-- MAIN CANVAS -->
  <text x="270" y="98" font-size="12" fill="#8a8a8a">FinAuditEase  /  Administrator  /  Governance  /  Reports &amp; Analytics</text>
  <text x="270" y="132" font-size="24" font-weight="800" fill="#1c1c1c">Platform Reports, Adoption &amp; Compliance Analytics</text>
  <text x="270" y="152" font-size="13" fill="#4a4a4a">Generate regulatory compliance summaries, user growth metrics, engagement turnaround statistics, and batch exports.</text>

