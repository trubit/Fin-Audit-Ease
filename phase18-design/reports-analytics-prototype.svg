  <rect x="180" y="24" width="90" height="20" rx="10" fill="#e8f5ee"/>
  <text x="225" y="38" font-size="11" font-weight="700" fill="#1a6b4a" text-anchor="middle">ADMIN PLATFORM</text>

  <!-- SIDEBAR -->
  <rect x="0" y="64" width="240" height="936" fill="#ffffff" stroke="#e2e8e4"/>
