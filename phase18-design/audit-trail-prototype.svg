  <text x="270" y="132" font-size="24" font-weight="800" fill="#1c1c1c">Administrative Audit Trail &amp; Compliance History</text>
  <text x="270" y="152" font-size="13" fill="#4a4a4a">Immutable WORM evidentiary log of administrative, operational, and user actions across FinAuditEase.</text>

  <!-- IMMUTABILITY NOTICE -->
  <rect x="270" y="175" width="1280" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="290" y="204" font-size="12" font-weight="bold" fill="#0f172a">🔒 Statutory Immutability Enforced:</text>
  <text x="530" y="204" font-size="12" fill="#475569">Audit records cannot be edited or permanently deleted by administrators or database users. Every record is cryptographically signed with SHA-256 root hashing.</text>

  <!-- AUDIT LOGS TABLE -->
  <rect x="270" y="240" width="1280" height="480" rx="10" fill="#ffffff" stroke="#e2e8e4" filter="url(#shadow)"/>
  <rect x="270" y="240" width="1280" height="44" rx="10" fill="#f8fafc"/>
