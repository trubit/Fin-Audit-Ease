  <text x="32" y="418" font-size="13" font-weight="600" fill="#ffffff">📜 Audit Trail</text>
  <text x="32" y="460" font-size="13" fill="#4a4a4a">🛡️ Security Centre</text>
  <text x="32" y="500" font-size="13" fill="#4a4a4a">📈 Reports &amp; Analytics</text>
  <text x="32" y="540" font-size="13" fill="#4a4a4a">⚙️ Platform Settings</text>

  <!-- MAIN CANVAS -->
